let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
const times = n => n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? "раза" : "раз";
const ORDER = {need:0, edge:1, min:2, ok:3};
const BADGE = {need:["Заказать","b-need"], edge:["Может закончиться","b-edge"], min:["На минимуме","b-min"], ok:["В норме","b-ok"]};
/* Вкладка «Нужен неснижаемый»: что предлагаю сделать с минимумом */
const kind = i => i.prop === i.min ? null : i.min === 0 ? "add" : i.prop === 0 ? "drop" : i.prop > i.min ? "up" : "down";
const KIND = {add:["Добавить","b-add"], up:["Поднять","b-add"], down:["Снизить","b-edge"], drop:["Убрать","b-need"]};
const KORDER = {add:0, up:1, down:2, drop:3};
const less = i => kind(i) === "down" || kind(i) === "drop";
let tab = "stock", st = "all", ch = "all", cat = "Все", br = "Все", q = "";
try { const s = JSON.parse(localStorage.getItem("ms-yar") || "{}"); tab = s.tab || tab; st = s.st || st; ch = s.ch || ch; } catch(e) {}
const save = () => { try { localStorage.setItem("ms-yar", JSON.stringify({tab, st, ch})); } catch(e) {} };

const inTab = i => tab === "stock" ? i.min > 0 : kind(i) !== null;
function match(i){
  if (!inTab(i)) return false;
  if (tab === "stock" && st !== "all" && i.st !== st) return false;
  if (tab === "need" && ch !== "all" && (ch === "less" ? !less(i) : kind(i) !== ch)) return false;
  if (cat !== "Все" && i.c !== cat) return false;
  if (br !== "Все" && i.b !== br) return false;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean), s = i.n.toLowerCase();
  return words.every(w => s.includes(w));
}

function chips(){
  const nStock = D.items.filter(i => i.min > 0).length, nNeed = D.items.filter(i => kind(i) === "add" || kind(i) === "up").length;
  $("#tabs").innerHTML = `<button class="tab${tab==="stock"?" on":""}" data-tab="stock">Остатки<span class="k">${nStock}</span></button>` +
    `<button class="tab${tab==="need"?" on":""}" data-tab="need">Нужен неснижаемый<span class="k">${nNeed}</span></button>` +
    `<button class="tab${tab==="orders"?" on":""}" data-tab="orders">Заказы<span class="k">${(D.om || []).length ? monthQty(D.om[0]) : 0}</span></button>` +
    `<button class="tab${tab==="stale"?" on":""}" data-tab="stale">Лежит<span class="k">${(D.stale || []).filter(r => worth(r) >= CHEAP).length}</span></button>` +
    (D.co ? `<button class="tab${tab==="co"?" on":""}" data-tab="co">В доставке<span class="k">${coOpen().filter(o => !coStuck(o)).length}</span></button>` : "") +
    (D.lost ? `<button class="tab${tab==="lost"?" on":""}" data-tab="lost">Упущенные<span class="k">${lostRows().filter(r => r[0] >= lostFrom("m")).length}</span></button>` : "") +
    (D.lost ? `<button class="tab${tab==="fb"?" on":""}" data-tab="fb">Идеи<span class="k">${fbItems().filter(x => !/сделано|не будем/.test(fbStatus(x))).length}</span></button>` : "");
  { const tb = $("#tabs"), a = tb.querySelector(".tab.on"); if (a && tb.scrollWidth > tb.clientWidth) tb.scrollLeft = Math.max(0, a.offsetLeft - tb.offsetLeft - 40); }
  if (tab === "lost") return chipsLost();
  if (tab === "fb") { $("#st").innerHTML = $("#mon").innerHTML = $("#cats").innerHTML = $("#brands").innerHTML = ""; return; }
  if (tab === "co") { $("#st").innerHTML = $("#mon").innerHTML = $("#cats").innerHTML = $("#brands").innerHTML = ""; return; }
  if (tab === "orders") return chipsOrders();
  if (tab === "stale") return chipsStale();
  $("#mon").innerHTML = "";
  const base = D.items.filter(i => inTab(i) && (cat === "Все" || i.c === cat));
  let S, n;
  if (tab === "stock") {
    S = [["all","Все",""],["need","Заказать","s-need"],["edge","Может закончиться","s-edge"],["min","На минимуме","s-min"],["ok","В норме","s-ok"]];
    n = k => base.filter(i => k === "all" || i.st === k).length;
    $("#st").innerHTML = S.map(([k,t,c]) => `<button class="chip ${c}${st===k?" on":""}" data-st="${k}">${t}<span class="k">${n(k)}</span></button>`).join("");
  } else {
    S = [["all","Все",""],["add","Добавить","s-chg"],["up","Поднять","s-chg"],["less","Снизить или убрать","s-edge"]];
    n = k => base.filter(i => k === "all" || (k === "less" ? less(i) : kind(i) === k)).length;
    $("#st").innerHTML = S.map(([k,t,c]) => `<button class="chip ${c}${ch===k?" on":""}" data-ch="${k}">${t}<span class="k">${n(k)}</span></button>`).join("");
  }
  const cnt = {}; D.items.filter(i => inTab(i) && (br === "Все" || i.b === br)).forEach(i => cnt[i.c] = (cnt[i.c] || 0) + 1);
  const cats = ["Все", ...Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a] || a.localeCompare(b, "ru"))];
  $("#cats").innerHTML = cats.map(c => `<button class="chip${cat===c?" on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  const bc = {}; D.items.filter(i => inTab(i) && (cat === "Все" || i.c === cat)).forEach(i => bc[i.b] = (bc[i.b] || 0) + 1);
  const brs = ["Все", ...Object.keys(bc).sort((a,b) => bc[b] - bc[a] || a.localeCompare(b, "ru"))];
  $("#brands").innerHTML = brs.map(b => `<button class="chip br${br===b?" on":""}" data-br="${esc(b)}">${b === "Все" ? "Все бренды" : esc(b)}${b !== "Все" ? `<span class="k">${bc[b]}</span>` : ""}</button>`).join("");
}

function bars(i){
  const withO = D.orders, mx = Math.max(1, ...i.m, ...(withO ? i.o : []));
  const col = (v, cls, last) => `<div class="bcol"><div class="bv ${cls}">${v ? fmt(v) : ""}</div><div class="bb ${cls}${last ? " cur" : ""}" style="height:${Math.round(v / mx * 58)}px"></div></div>`;
  const cols = i.m.map((v, k) => { const last = k === i.m.length - 1;
    return `<div class="bc"><div class="bpair">${col(v, "", last)}${withO ? col(i.o[k], "o", last) : ""}</div><div class="bl">${D.mon[k]}</div></div>`; }).join("");
  const legend = withO ? `<span class="lg"></span>продано <span class="lg o"></span>заказывали под клиента · ` : "";
  return `<details><summary>${withO ? "Продажи и заказы по месяцам" : "Продажи по месяцам"}</summary><div class="bars">${cols}</div><div class="bn">${legend}${esc(D.monNote)}, бледное — месяц ещё идёт</div></details>`;
}

const title = i => (i.u ? `<a class="nm" href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.n)}</a>` : `<span class="nm">${esc(i.n)}</span>`) + (i.v ? ` <span class="vit">витрина</span>` : "");
/* Закупка из парсера upgrade33 (коммерческая тайна — только на этой закрытой странице) */
const rub = n => Math.round(n).toLocaleString("ru-RU") + " ₽";
const ddmm = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) : "";
function priceInfo(i){
  if (!D.prices) return "";
  if (i.pa === false) return `<div class="row"><span class="l"><span class="tred">нет у поставщиков</span>${i.lp ? ` · последняя закупка ${rub(i.lp)}${i.ls ? " (" + ddmm(i.ls) + ")" : ""}` : ""}</span></div>`;
  if (i.buy == null) return "";  // товара нет в круге закупок парсера
  const parts = [`закупка от <b>${rub(i.buy)}</b>`];
  if (i.sp) parts.push(`наценка ${Math.round((i.sp / i.buy - 1) * 100)}%`);

    : i.pt === "up" ? `<span class="tgreen">↑ ${fmt(i.pc)}% за 30 дн.</span>` : "цена стабильна");
  return `<div class="row"><span class="l">${parts.join(" · ")}</span></div>`;
}
function advice(i){
  if (!D.prices || i.pa !== true || i.pc == null) return "";
  if (i.pc <= -3) return `<div class="adv amber">Закупка дешевеет — бери только до минимума, не впрок</div>`;
  if (i.pc >= 3) return `<div class="adv green">Закупка дорожает — можно взять с запасом</div>`;
  return "";
}
/* Оборот в неделю по 12 / 8 / 4 неделям: если за 4 недели больше, чем за 12, — спрос растёт */
const WEEKS = [12, 8, 4, 1];
function trend(i){  // 4 недели против 12: растёт / падает / ровно
  const [a, , c] = i.wk;
  if (c >= a * 1.2 && c - a >= 0.25) return `<span class="tgreen">↗ растёт</span>`;
  if (c <= a * 0.8 && a - c >= 0.25) return `<span class="tamber">↘ падает</span>`;
  return `<span style="color:var(--muted);font-weight:400">→ ровно</span>`;
}
const wkText = i => i.wk ? `≈ ${fmt(i.pm)} шт в нед. ${trend(i)}` : `продаём ≈ ${fmt(i.pm)} в мес.`;
function wkBlock(i){
  if (!i.wk) return "";
  const half = i.pm * 0.5, f2 = x => x.toFixed(2).replace(/\.?0+$/, "").replace(".", ",");
  return `<table class="wkt"><tr>${WEEKS.map(n => `<th>${n === 1 ? "1 нед." : n + " нед."}</th>`).join("")}</tr>` +
    `<tr>${i.wk.map((r, k) => `<td><b>${Math.round(r * WEEKS[k])}</b> шт</td>`).join("")}</tr>` +
    `<tr>${i.wk.map(r => `<td>${fmt(r)}/нед</td>`).join("")}</tr></table>` +
    (!i.note && Math.ceil(half - 1e-9) === i.prop ? `<div class="wkn">неснижаемый = половина недели: ${f2(half)} → вверх до ${i.prop} шт</div>` : "");
}
const ordersText = i => !D.orders ? "" : i.ot ? `под заказ ${i.ot} ${times(i.ot)}` : "под заказ не брали";
/* Где взять вместо закупки: свободный остаток других магазинов сети */
const srcInfo = i => (i.src || []).length ? `<div class="src">Можно забрать — у них не продаётся: ${i.src.map(s =>
  `<b>${esc(s[0])}</b> ${s[1]} шт${s[3] ? ` (лежит ${s[2]} дн., у них не продаётся)` : s[2] >= 30 ? ` (лежит ${s[2]} дн.)` : ""}`).join(" · ")}</div>` : "";
const srcShort = i => (i.src || []).length ? ` (можно взять: ${i.src.map(s => `${s[0]} ${s[1]}`).join(", ")})` : "";

/* Обе SIM-версии одного iPhone рядом: eSIM и SIM+eSIM той же памяти и цвета */
function twinInfo(i){
  const t = i.tw; if (!t) return "";
  const lab = n => /\(SIM\+eSIM\)/.test(n) ? "SIM+eSIM" : "eSIM";
  const full = a => a.slice(0, -1).reduce((s, v) => s + v, 0), cur = a => a[a.length - 1];
  const tr = (x, me) => `<tr${me ? ` class="me"` : ""}><td>${x.u && !me ? `<a href="${esc(x.u)}" target="_blank" rel="noopener">${lab(x.n)}</a>` : lab(x.n)}</td>` +
    `<td>${fmt(x.av)}</td><td>${x.min || "—"}</td><td>${fmt(full(x.m))}</td><td>${fmt(cur(x.m))}</td><td>${D.orders ? full(x.o) + cur(x.o) : "—"}</td>` +
    `<td>${x.pa === false ? "нет" : x.buy ? Math.round(x.buy / 1000) + " т" : "—"}</td></tr>`;
  return `<div class="ywrap"><table class="ytab tw"><tr><th>SIM</th><th>есть</th><th>мин.</th><th>продано<br>3 мес.</th><th>${esc(D.mon[D.mon.length - 1])}</th><th>заказы</th><th>закуп.</th></tr>${tr(i, true)}${tr(t, false)}</table></div>`;
}

/* Цвета одной модели рядом: что берут, сколько есть, какой минимум (на витрине каждый цвет — от 1 шт) */
function colorBlock(i){
  const g = i.cg; if (!g) return "";
  const tot = g.reduce((s, c) => s + c[1], 0), me = i.n;
  const rows = g.map(([c, q, sh, av, mn, pr]) => {
    const cur = me.includes(c);
    const ch = pr === mn ? `${mn || "—"}` : `${mn || 0} → <b>${pr}</b>`;
    return `<tr${cur ? ` class="me"` : ""}><td class="cn">${esc(c)}</td><td><span class="cb" style="width:${Math.max(sh, 2)}%"></span></td>` +
      `<td>${q}</td><td>${sh}%</td><td>${fmt(av)}</td><td>${ch}</td></tr>`;
  }).join("");
  return `<details class="clr"><summary>Цвета этой модели · ${tot} шт за 12 нед.</summary>` +
    `<table class="ytab ct2"><tr><th>цвет</th><th></th><th>продано</th><th>доля</th><th>есть</th><th>мин.</th></tr>${rows}</table></details>`;
}

const shortName = n => esc(n.replace(/^Смартфон\s+/i, "").replace(" (без RuStore)", ""));
const msLink = u => u ? `<div class="row"><a class="nm" href="${esc(u)}" target="_blank" rel="noopener" style="font-size:13px">открыть в МойСкладе ↗</a></div>` : "";

function card(i){
  const [bt, bc] = BADGE[i.st];
  const big = `<div class="v">${fmt(i.av)} <small>из ${i.min}</small></div>` +
    (i.need > 0 ? `<div class="r red">добрать ${i.need} шт</div>` :
     i.st === "edge" ? `<div class="r amber">≈ ${fmt(i.until)} шт уйдёт до ${D.d1gen}</div>` :
     i.st === "min" ? `<div class="r" style="color:var(--muted)">до поставки хватит</div>` : `<div class="r green">хватает</div>`);
  const parts = [`остаток ${fmt(i.stk)}`]; if (i.res) parts.push(`резерв ${fmt(i.res)}`); if (i.tr) parts.push(`в пути ${fmt(i.tr)}`);
  const k = kind(i);
  const hint = k ? `<div class="pr">Предлагаю ${k === "drop" ? "<b>убрать из неснижаемого</b>" : `${k === "up" ? "поднять" : "снизить"} неснижаемый <b>${i.min} → ${i.prop}</b>`} — подробнее на вкладке «Нужен неснижаемый»</div>` : "";
  // одна строка: точка статуса, название, «есть из минимума · что делать · в неделю · закупка»; подробности — по нажатию
  const state = i.need > 0 ? `<span class="tred">добрать ${i.need}</span>` : i.st === "edge" ? `<span class="tamber">может закончиться</span>`
    : i.st === "min" ? "на минимуме" : `<span class="tgreen">хватает</span>`;
  const price = D.prices && i.buy ? ` · ${rub(i.buy)}${i.pt === "down" ? " ↓" : i.pt === "up" ? " ↑" : ""}` : "";
  const take = (i.src || []).length && i.st !== "ok" ? ` · <span class="tgreen">можно забрать</span>` : "";
  const nm = shortName(i.n);
  return `<details class="pc"><summary><span class="dot d-${i.st}" title="${bt}"></span><div class="pcm">` +
    `<div class="pcn">${nm}${i.v ? ` <span class="vit">витрина</span>` : ""}</div>` +
    `<div class="pcs">${fmt(i.av)} из ${i.min} · ${state} · ${fmt(i.pm)}/нед${price}${take}</div></div></summary>
    <div class="pcb">
    <div class="big">${big}</div>
    <div class="row"><span class="l">${parts.join(" · ")}</span><span class="x">${wkText(i)}</span></div>
    ${wkBlock(i)}
    ${priceInfo(i)}${i.st !== "ok" ? advice(i) + srcInfo(i) : ""}${hint}${twinInfo(i)}${colorBlock(i)}${bars(i)}
    ${msLink(i.u)}
  </div></details>`;
}

function cardNeed(i){
  const k = kind(i), [bt, bc] = KIND[k];
  const big = k === "drop" ? `<div class="v">убрать <small>из неснижаемого</small></div><div class="r" style="color:var(--muted)">сейчас ${i.min}</div>`
    : `<div class="v">${i.prop} <small>шт — ${k === "add" ? "поставить" : "неснижаемый"}</small></div><div class="r" style="color:var(--muted)">${i.min ? "сейчас " + i.min : "сейчас нет"}</div>`;
  const facts = [wkText(i)]; const o = ordersText(i); if (o) facts.push(o + ` за ${D.mon.length} мес.`);
  if (i.lo) facts.push(`<span class="tred">упустили ${i.lo} ${pl(i.lo, "раз", "раза", "раз")} за 30 дн.</span>`);
  const why = i.note || (k === "add" || k === "up" ? "продаётся каждый месяц — минимума не хватает" : "продаётся редко — выгоднее под заказ");
  const change = k === "drop" ? `${i.min} → убрать` : `${i.min || 0} → <b>${i.prop}</b>`;
  const tone = {add: "d-add", up: "d-add", down: "d-edge", drop: "d-need"}[k];
  const short = [`${fmt(i.pm)}/нед`]; if (i.ot) short.push(`под заказ ${i.ot}`); if (i.lo) short.push(`<span class="tred">упустили ${i.lo}</span>`);
  return `<details class="pc"><summary><span class="dot ${tone}" title="${bt}"></span><div class="pcm">` +
    `<div class="pcn">${shortName(i.n)}${i.v ? ` <span class="vit">витрина</span>` : ""}</div>` +
    `<div class="pcs">${bt.toLowerCase()} ${change} · ${short.join(" · ")}</div></div></summary>
    <div class="pcb">
    <div class="big">${big}</div>
    <div class="row"><span class="x">${facts.join(" · ")}</span></div>
    ${wkBlock(i)}
    <div class="row"><span class="l">на складе ${fmt(i.av)} · ${esc(why)}</span></div>
    ${priceInfo(i)}${k === "add" || k === "up" ? advice(i) + srcInfo(i) : ""}
    ${twinInfo(i)}${colorBlock(i)}${bars(i)}
    ${msLink(i.u)}
  </div></details>`;
}

/* Вкладка «Заказы»: что заказывали под клиента — по годам и месяцам (все листы «Заказы …» таблицы «База Ярославль») */
const MSH = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
let oy = null, om = "all";
const pl = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
function omMatch(r){
  if (cat !== "Все" && r.c !== cat) return false;
  if (br !== "Все" && r.b !== br) return false;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean), s = r.n.toLowerCase();
  return words.every(w => s.includes(w));
}
const monthQty = m => m.items.filter(omMatch).reduce((s, r) => s + r.q, 0);
const years = () => [...new Set((D.om || []).map(m => m.k.slice(0, 4)))].sort().reverse();
const yearMonths = y => (D.om || []).filter(m => m.k.startsWith(y));
/* Период «с … по …», как в МойСкладе: вч · сег · нед · мес. Пока даты пустые — смотрим по годам и месяцам */
let pf = "", pt = "";
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dmy = s => `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}`;
const PRESETS = [["y", "вч"], ["t", "сег"], ["w", "нед"], ["m", "мес"], ["h", "полгода"]];
function preset(k){
  const t = new Date(), a = new Date();
  if (k === "y") { a.setDate(a.getDate() - 1); return [iso(a), iso(a)]; }
  if (k === "t") return [iso(t), iso(t)];
  if (k === "w") a.setDate(a.getDate() - 7); else a.setMonth(a.getMonth() - (k === "h" ? 6 : 1));
  return [iso(a), iso(t)];
}
const inPeriod = () => !!(pf && pt);
const range = () => pf <= pt ? [pf, pt] : [pt, pf];
function periodRows(f){  // заказы за период, сложенные по устройствам
  const [a, b] = range(), acc = {};
  (D.ol || []).forEach(([d, i, s]) => {
    if (d < a || d > b || !f(D.od[i])) return;
    const r = acc[i] = acc[i] || Object.assign({q: 0, s: {}}, D.od[i]);
    r.q++; r.s[s] = (r.s[s] || 0) + 1;
  });
  return Object.values(acc).sort((x, y) => y.q - x.q || x.n.localeCompare(y.n, "ru"));
}
let showDates = false;  // поля «с … по …» — только по ссылке «свои даты» или когда период уже задан
function periodBlock(){
  const on = k => { const [a, b] = preset(k); return a === pf && b === pt; };
  const dates = showDates || (pf && !PRESETS.some(([k]) => on(k)));
  return `<div class="per">Период: ${PRESETS.map(([k, t]) => `<button class="pl${on(k) ? " on" : ""}" data-pp="${k}">${t}</button>`).join(`<span class="dot">·</span>`)}` +
    `<span class="dot">·</span><button class="pl${dates ? " on" : ""}" data-pp="d">свои даты</button>` +
    `${pf || pt ? `<span class="dot">·</span><button class="pl" data-pp="x">сбросить</button>` : ""}` +
    (dates ? `<div class="pd"><input type="date" id="pf" value="${pf}"> — <input type="date" id="pt" value="${pt}"></div>` : "") + `</div>`;
}
/* Фильтры «Заказов» — одной строкой выпадающих списков: год, месяц, категория, бренд */
function chipsOrders(){
  const ys = years(); if (!oy || !ys.includes(oy)) oy = ys[0];
  const ms = yearMonths(oy);
  const rows = inPeriod() ? periodRows(() => true) : ms.filter(m => om === "all" || m.k === om).flatMap(m => m.items);
  const cc = {}; rows.filter(r => br === "Все" || r.b === br).forEach(r => cc[r.c] = (cc[r.c] || 0) + r.q);
  const bc = {}; rows.filter(r => cat === "Все" || r.c === cat).forEach(r => bc[r.b] = (bc[r.b] || 0) + r.q);
  const opt = (v, t, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${t}</option>`;
  const yearSel = inPeriod() ? `<select class="fsel" data-fy><option value="">год — по периоду</option>${ys.map(y => opt(y, y, false)).join("")}</select>`
    : `<select class="fsel" data-fy>${ys.map(y => opt(y, `${y} · ${yearMonths(y).reduce((s, m) => s + monthQty(m), 0)}`, oy === y)).join("")}</select>`;
  const monSel = inPeriod() ? "" : `<select class="fsel" data-fm>${opt("all", "все месяцы", om === "all")}${ms.map(m => opt(m.k, `${MSH[+m.k.slice(5) - 1]} · ${monthQty(m)}`, om === m.k)).join("")}</select>`;
  const catSel = `<select class="fsel" data-fc>${opt("Все", "все категории", cat === "Все")}${Object.keys(cc).sort((a, b) => cc[b] - cc[a]).map(c => opt(c, `${esc(c)} · ${cc[c]}`, cat === c)).join("")}</select>`;
  const brSel = `<select class="fsel" data-fb>${opt("Все", "все бренды", br === "Все")}${Object.keys(bc).sort((a, b) => bc[b] - bc[a]).map(b => opt(b, `${esc(b)} · ${bc[b]}`, br === b)).join("")}</select>`;
  $("#st").innerHTML = periodBlock() + `<div class="frow">${yearSel}${monSel}${catSel}${brSel}</div>`;
  $("#mon").innerHTML = $("#cats").innerHTML = $("#brands").innerHTML = "";
}
document.addEventListener("change", e => {  // выпадающие фильтры «Заказов»
  const t = e.target; if (!t.matches || !t.matches(".fsel")) return;
  if (t.hasAttribute("data-fy")) { if (!t.value) return; oy = t.value; om = "all"; pf = pt = ""; showDates = false; }
  else if (t.hasAttribute("data-fm")) om = t.value;
  else if (t.hasAttribute("data-fc")) cat = t.value;
  else if (t.hasAttribute("data-fb")) br = t.value;
  render();
});
function orow(r){  // одна строка, как в «Остатках»: точка-итог, название, коротко, справа — сколько раз заказывали
  const info = [Object.entries(r.s).map(([k, v]) => `${k} ${v}`).join(", ")];
  if (r.nf) info.push("нет в МойСкладе");
  else { info.push(r.min ? `неснижаемый ${r.min}` : "неснижаемого нет"); if (r.av != null) info.push(`на складе ${fmt(r.av)}`); }
  const lost = (r.s["не купили"] || 0) + (r.s["у конкурента"] || 0), done = r.s["выдан"] || 0;
  const tone = lost ? "d-edge" : done === r.q ? "d-ok" : "d-min";
  const nm = shortName(r.n) + (r.u ? ` <a class="ms2" href="${esc(r.u)}" target="_blank" rel="noopener" title="открыть в МойСкладе">↗</a>` : "");
  return `<div class="orow orow3"><span class="dot ${tone}"></span><div class="pcm"><div class="pcn">${nm}</div><div class="pcs">${esc(info.join(" · "))}</div></div><div class="oq">${r.q}</div></div>`;
}
function yearTableBox(){  // таблица «месяцы × годы» — свёрнута, раскрывается по нажатию
  return `<details class="ytd" data-grp="yt"${coOpenGroups.has("yt") ? " open" : ""}><summary>📊 Таблица по месяцам и годам</summary>${yearTable()}</details>`;
}
function yearTable(){
  const ys = years().slice().reverse(), cell = {};
  (D.om || []).forEach(m => cell[m.k] = monthQty(m));
  const head = `<tr><th></th>${ys.map(y => `<th class="${y === oy ? "ysel" : ""}">${y}</th>`).join("")}</tr>`;
  const body = MSH.map((mn, i) => {
    const mm = String(i + 1).padStart(2, "0");
    return `<tr><td>${mn}</td>${ys.map(y => { const k = `${y}-${mm}`, v = cell[k];
      return v == null ? `<td class="${y === oy ? "ysel" : ""}">—</td>`
        : `<td class="c${y === oy ? " ysel" : ""}${om === k ? " msel" : ""}" data-oy="${y}" data-om="${k}">${v}</td>`; }).join("")}</tr>`;
  }).join("");
  const tot = `<tr class="tot"><td>Итого</td>${ys.map(y => `<td class="${y === oy ? "ysel" : ""}">${yearMonths(y).reduce((s, m) => s + monthQty(m), 0)}</td>`).join("")}</tr>`;
  return `<div class="ywrap"><table class="ytab">${head}${body}${tot}</table></div>`;
}
function renderOrders(){
  $("#copy").textContent = "Скопировать список";
  const osrc = (D.obase ? `до ${ddmm(D.obase)} — по старой таблице заказов, дальше — ` : "") + "заказы из МойСклада, которые проходили «В доставке»; без отмен и аксессуаров.";
  if (!(D.om || []).length) { $("#sum").innerHTML = "Заказов под клиента пока нет: они появятся, когда заказы пройдут «В доставке»."; $("#list").innerHTML = ""; return; }
  if (inPeriod()) {
    const [a, b] = range(), rows = periodRows(omMatch), n = rows.reduce((s, r) => s + r.q, 0);
    $("#sum").innerHTML = `Заказы под клиента с <b>${dmy(a)}</b> по <b>${dmy(b)}</b>: <b>${n}</b> ${pl(n, "заказ", "заказа", "заказов")} · ${rows.length} ${pl(rows.length, "устройство", "устройства", "устройств")}` +
      `<div class="sub">${osrc}</div>` + yearTableBox();
    $("#list").innerHTML = rows.length ? `<div class="card olist">${rows.map(orow).join("")}</div>` : `<div class="empty">За этот период заказов нет</div>`;
    return;
  }
  $("#sum").innerHTML = `Заказы под клиента по годам и месяцам` +
    `<div class="sub">${osrc}</div>` + yearTableBox();
  const html = yearMonths(oy).filter(m => om === "all" || m.k === om).map(m => {
    const rows = m.items.filter(omMatch); if (!rows.length) return "";
    const n = rows.reduce((s, r) => s + r.q, 0);
    return `<div class="gh">${esc(m.label)} · ${n} ${pl(n, "заказ", "заказа", "заказов")}</div><div class="card olist">${rows.map(orow).join("")}</div>`;
  }).join("");
  $("#list").innerHTML = html || `<div class="empty">Ничего не найдено</div>`;
}

/* Вкладка «Лежит»: устройства Ярославля без продаж и магазины сети, где их покупают */
const SK = {idle:["60+ дн.","b-need"], slow:["30–60 дн.","b-edge"], cover:["запас 3+ мес.","b-add"]};
const CHEAP = 5000;  // дешевле — «мелочь», свёрнута внизу
let sk = "all";
const worth = r => r.cost * r.q;
const dest = r => r.to.find(t => t[1] >= 1);  // магазин, где этот товар покупают
const staleList = () => (D.stale || []).filter(r => (sk === "all" || r.k === sk) && omMatch(r));
function chipsStale(){
  const rows = D.stale || [], inK = r => sk === "all" || r.k === sk;
  const base = rows.filter(r => (cat === "Все" || r.c === cat) && (br === "Все" || r.b === br));
  const S = [["all","Все",""],["idle","60+ дней без продаж","s-need"],["slow","30–60 дней","s-edge"],["cover","Запас на 3+ мес.","s-chg"]]
    .filter(([k]) => k === "all" || k === sk || rows.some(r => r.k === k));
  $("#st").innerHTML = S.map(([k,t,c]) => `<button class="chip ${c}${sk===k?" on":""}" data-sk="${k}">${t}<span class="k">${base.filter(r => k === "all" || r.k === k).length}</span></button>`).join("");

/* Комментарий ребят к заказу (просьба Игоря, 24.10.2026): пишется со страницы в ту же таблицу, виден всем */
const PEND_N = "ms-yar-pending-notes";
let notesLive = null, noteEdit = new Set();
const pendingNotes = () => { try { return JSON.parse(localStorage.getItem(PEND_N) || "[]"); } catch(e) { return []; } };
function noteOf(num){
  const base = notesLive || (D.co || {}).notes || [];
  const have = new Set(base.map(n => n[1] + "|" + n[2])), cutoff = Date.now() - 30 * 60000;
  const pend = pendingNotes().filter(n => !have.has(n[1] + "|" + n[2]) && (n[3] || 0) > cutoff);
  try { localStorage.setItem(PEND_N, JSON.stringify(pend)); } catch(e) {}
  return base.concat(pend.map(n => n.slice(0, 3))).map((n, i) => [n, i]).filter(([n]) => n[1] === num)
    .sort((a, b) => b[0][0].localeCompare(a[0][0]) || b[1] - a[1]).map(([n]) => n)[0];
}
/* Ссылка в комментарии со страницы — такая же зелёная кнопка, как телефон (Кирилл, 07.11.2026) */
const chatName = u => /avito\.ru/i.test(u) ? "Авито" : /t\.me|telegram/i.test(u) ? "Telegram" : /max\.ru/i.test(u) ? "Max" : /vk\.(com|me)/i.test(u) ? "ВК" : /wa\.me|whatsapp/i.test(u) ? "WhatsApp" : /instagram/i.test(u) ? "Инстаграм" : "Ссылка";
function noteLinks(t){
  let out = "", at = 0;
  for (const m of t.matchAll(/(?:https?:\/\/|www\.|\b(?:web\.)?(?:t\.me|max\.ru)\/)[^\s<,;]+/gi)) {
    const u = m[0], url = /^http/i.test(u) ? u : "https://" + u;
    out += esc(t.slice(at, m.index)) + `<a class="call" href="${esc(url)}" target="_blank" rel="noopener">💬 ${chatName(u)}</a>`;
    at = m.index + u.length;
  }
  return out + esc(t.slice(at));
}

  if (noteEdit.has(o.num)) return `<div class="ocme"><input class="cmi" id="cmi-${esc(o.num)}" value="${esc(n ? n[2] : "")}" placeholder="например: заберёт в пятницу" maxlength="300">` +

/* Вкладка «Идеи»: ребята пишут, что не работает, что исправить и чего не хватает; статус меняем, когда сделали */
const FB_T = [["не работает", "🐞 Не работает", "d-need"], ["исправить", "🔧 Исправить", "d-edge"], ["идея", "💡 Идея", "d-add"]];
const FB_ST = ["новое", "в работе", "сделано", "не будем"];
let fbLive = null, fbType = "не работает", fbPend = [];
function parseFb(t){
  const items = [], st = {}, re = {};
  csvRows(t).forEach(r => {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(r[0] || ""), why = (r[2] || "").trim().toLowerCase();
    if (!m || (r[1] || "").trim() || (r[5] || "").trim() || !why.startsWith("#")) return;
    const stamp = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")} ${m[4].padStart(2, "0")}:${m[5]}:${m[6] || "00"}`;
    if (["#не работает", "#исправить", "#идея"].includes(why) && (r[4] || "").trim()) items.push([stamp, why.slice(1), r[4].trim(), (r[3] || "").trim()]);
    else if (why === "#статус" && (r[4] || "").includes("|")) { const [k, v] = r[4].split("|"); st[k.trim()] = v.trim(); }
    else if (why === "#ответ" && (r[4] || "").includes("|")) {
      const i = r[4].indexOf("|"), k = r[4].slice(0, i).trim(), v = r[4].slice(i + 1).trim();
      if (v) (re[k] = re[k] || []).push([stamp, v, (r[3] || "").trim()]);
    }
  });
  return {items, st, re};
}
const fbData = () => fbLive || D.fb || {items: [], st: {}};
const fbItems = () => fbData().items.concat(fbPend.filter(p => !fbData().items.some(x => x[0] === p[0] || (x[2] === p[2] && x[3] === p[3]))));

/* Ответы под записью: видны всем, пишутся в ту же таблицу */
let fbReEdit = new Set(), fbRePend = [];
const fbReplies = key => {
  const base = (fbData().re || {})[key] || [];
  return base.concat(fbRePend.filter(p => p[0] === key && !base.some(b => b[1] === p[2])).map(p => [p[1], p[2], p[3]]))
    .sort((a, b) => a[0].localeCompare(b[0]));
};
async function fbSendReply(key){

}

}

function chnBox(){
  const c = D.chn; if (!c || !c.rows.length) return "";

    `<td><b class="${p == null ? "" : p >= 85 ? "tgreen" : p >= 65 ? "tamber" : "tred"}">${p == null ? "—" : p + "%"}</b></td></tr>`; };

function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1800); }
function copy(t){
  const ok = () => toast("Скопировано");

  function fb(){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); ok(); }

/* Вход: ключ из пароля (PBKDF2-SHA256) расшифровывает данные (AES-256-GCM). Без пароля данных на странице нет. */
const KEY_STORE = "ms-yar-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
let PKEY = null;   // ключ в памяти вкладки — чтобы подхватить свежие данные без пароля
async function decryptWith(key, enc){
  enc = enc || ENC;
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(enc.iv)}, key, b64(enc.ct));
  PKEY = key;
  return JSON.parse(new TextDecoder().decode(plain));
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
function forget(){ try { localStorage.removeItem(KEY_STORE); } catch(e) {} }
async function autoLogin(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null"); } catch(e) {}
  if (!saved || saved.salt !== ENC.salt) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
    start(await decryptWith(key));
  } catch(e) { forget(); }  // пароль сменили — спросим заново
}
$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; $("#err").textContent = "";
  try {
    const key = await keyFromPassword($("#pw").value);
    const data = await decryptWith(key);
    if ($("#rem").checked) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({salt: ENC.salt, k: toB64(await crypto.subtle.exportKey("raw", key))})); } catch(e2) {}
    } else forget();
    start(data);
  } catch(err) {
    $("#err").textContent = window.crypto && crypto.subtle ? "Неверный пароль" : "Браузер не поддерживает расшифровку — откройте страницу в Chrome или Safari";
  }
  btn.disabled = false;
});
$("#out").addEventListener("click", () => { forget(); location.reload(); });
/* Кнопка «⟳ обновить»: сервер компании заново берёт «В доставке» из МойСклада (~10 с), страница подхватывает без пароля */
$("#rfb").addEventListener("click", async () => {
  const b = $("#rfb"); if (b.disabled) return;
  b.disabled = true; b.textContent = "⟳ обновляю…";
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    const r = await fetch("api/refresh", {method: "POST", headers: {"X-Key": D.rk}}).then(x => x.json());
    if (!r.ok) { toast(r.msg || "Не получилось обновить"); throw null; }
    let done = false;
    for (let i = 0; i < 30 && !done; i++) { await wait(3000); done = (await fetch("api/status", {cache: "no-store"}).then(x => x.json())).t > r.t; }
    if (!done) { toast("Обновление идёт дольше обычного — загляни через пару минут"); throw null; }
    const html = await fetch(location.pathname, {cache: "no-store"}).then(x => x.text());
    start(await decryptWith(PKEY, JSON.parse(html.match(/const ENC = (\{.*?\});/)[1])));
    toast("Готово: заказы на " + (D.cog || D.gen));
  } catch(e) { if (e) toast("Не получилось обновить — попробуй позже"); }
  b.disabled = false; b.textContent = "⟳ обновить";
});
autoLogin();
