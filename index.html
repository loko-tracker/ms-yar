<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход — неснижаемый остаток</title>
<style>
:root{
  --navy:#1f3b5c; --navy2:#2a4c74; --bg:#f3f5f8; --card:#fff; --text:#1c2430; --muted:#6b7480; --line:#e6e9ee;
  --chip:#fff; --chipline:#d9dee5; --red:#c0392b; --redbg:#fdecea; --amber:#b8730a; --amberbg:#fff3df;
  --green:#1e8449; --greenbg:#e6f4ec; --blue:#2f6fb0; --bluebg:#e7f0fa; --bar:#2f6fb0; --shadow:0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11161d; --card:#1a212b; --text:#e6eaf0; --muted:#98a2b0; --line:#2a323e; --chip:#1a212b; --chipline:#323b48;
    --redbg:#3a1d1a; --amberbg:#3a2c14; --greenbg:#15301f; --bluebg:#172a40; --red:#ff7a6b; --amber:#f2b453; --green:#5fd08f; --blue:#7fb0ea; --bar:#5d98d8; --shadow:none; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hw{max-width:680px;margin:0 auto;padding:12px 16px 12px}
.ht{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:17px;margin:0;font-weight:700}
.hs{font-size:12px;opacity:.85;margin-top:2px}
.copy{flex:none;background:var(--navy2);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.copy:hover{background:#34598a}
#q{width:100%;margin-top:10px;border:0;border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;color:#1c2430;background:#fff}
main{max-width:680px;margin:0 auto;padding:12px 16px 40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--chipline);background:var(--chip);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .k{opacity:.65;margin-left:3px}
.chip.s-need.on{background:var(--red);border-color:var(--red)} .chip.s-edge.on{background:var(--amber);border-color:var(--amber)}
.chip.s-ok.on{background:var(--green);border-color:var(--green)} .chip.s-chg.on{background:var(--blue);border-color:var(--blue)}
.sum{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin:10px 0 4px;font-size:14px}
.sum b{font-size:16px}
.gh{font-weight:700;font-size:14px;margin:18px 2px 8px;color:var(--muted)}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.ct{display:flex;align-items:flex-start;gap:8px}
.badge{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.b-need{background:var(--redbg);color:var(--red)} .b-edge{background:var(--amberbg);color:var(--amber)}
.b-ok{background:var(--greenbg);color:var(--green)} .b-add{background:var(--bluebg);color:var(--blue)}
.nm{font-weight:600;font-size:14.5px;color:var(--text);text-decoration:none} .nm:hover{text-decoration:underline}
.big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.big .v{font-size:22px;font-weight:800}
.big .v small{font-size:13px;font-weight:600;color:var(--muted)}
.big .r{font-size:14px;font-weight:700;text-align:right}
.big .r.red{color:var(--red)} .big .r.amber{color:var(--amber)} .big .r.green{color:var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line);margin-top:6px}
.row .l{color:var(--muted)}
.row .x{font-weight:600}
.pr{background:var(--bluebg);color:var(--blue);border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:8px}
.pr b{font-size:14.5px}
.pr .why{display:block;color:var(--muted);font-size:12px;margin-top:2px}
details{margin-top:6px}
summary{list-style:none;cursor:pointer;text-align:center;color:var(--muted);font-size:13px;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary:before{content:"⌄ ";} details[open] summary:before{content:"⌃ ";}
.bars{display:flex;align-items:flex-end;gap:10px;height:96px;padding:6px 4px 0}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bv{font-size:12px;font-weight:700;margin-bottom:3px}
.bb{width:100%;max-width:28px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bb.cur{opacity:.45}
.bl{font-size:11.5px;color:var(--muted);margin-top:4px}
.bn{font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{color:var(--muted);font-size:12px;line-height:1.5;margin-top:24px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.box{width:100%;max-width:340px;background:var(--card);border-radius:14px;box-shadow:0 4px 18px rgba(20,30,50,.12);padding:24px 22px}
.box h2{margin:0 0 4px;font-size:19px}
.box p{margin:0 0 16px;color:var(--muted);font-size:14px}
.box input[type=password]{width:100%;border:1px solid var(--chipline);border-radius:9px;padding:11px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--text)}
.box label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:12px 0 14px;cursor:pointer}
.box button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:11px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.box button:disabled{opacity:.6}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-top:10px}
#app{display:none}
.out{background:none;border:0;color:#fff;opacity:.75;font:inherit;font-size:12px;cursor:pointer;padding:0;margin-left:6px;text-decoration:underline}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 8px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:#fff;color:var(--navy);font-weight:700;border-color:#fff}
.tab .k{opacity:.65;margin-left:5px;font-weight:400}
.sum .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.bpair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%}
.bcol{flex:1;max-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bb.o{background:var(--amber)} .bv.o{color:var(--amber)}
.lg{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--bar);margin:0 3px 0 0;vertical-align:baseline}
.lg.o{background:var(--amber);margin-left:6px}
.adv{border-radius:8px;padding:5px 10px;font-size:13px;margin-top:6px;font-weight:600}
.adv.amber{background:var(--amberbg);color:var(--amber)} .adv.green{background:var(--greenbg);color:var(--green)} .adv.red{background:var(--redbg);color:var(--red)}
.tred{color:var(--red);font-weight:700} .tamber{color:var(--amber);font-weight:600} .tgreen{color:var(--green);font-weight:600}
.olist{padding:2px 14px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.oq{flex:none;font-size:19px;font-weight:800;min-width:30px;text-align:right}
.os{font-size:12px;color:var(--muted);margin-top:2px}
.tabs .tab{padding:7px 6px}
.vit{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--chipline);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}
</style>
</head>
<body>
<div id="login"><form class="box" id="lf" autocomplete="on">
  <h2>Неснижаемый остаток</h2>
  <p>Закрытый раздел. Введите пароль.</p>
  <input type="text" name="username" value="ms-yar" autocomplete="username" hidden>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus required>
  <label><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
  <button id="go">Войти</button>
  <div class="err" id="err"></div>
</form></div>
<div id="app">
<header><div class="hw">
  <div class="ht">
    <div><h1>Неснижаемый остаток — Ярославль</h1><div class="hs"><span id="hs"></span><button class="out" id="out">выйти</button></div></div>
    <button class="copy" id="copy">Скопировать заказ</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <input id="q" type="search" placeholder="Поиск по названию…" autocomplete="off">
</div></header>
<main>
  <div class="chips" id="st"></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="brands"></div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>
</div>
<div class="toast" id="toast"></div>

  } else {
    S = [["all","Все",""],["add","Добавить","s-chg"],["up","Поднять","s-chg"],["less","Снизить или убрать","s-edge"]];

  }

}

function bars(i){
  const withO = D.orders, mx = Math.max(1, ...i.m, ...(withO ? i.o : []));
  const col = (v, cls, last) => `<div class="bcol"><div class="bv ${cls}">${v ? fmt(v) : ""}</div><div class="bb ${cls}${last ? " cur" : ""}" style="height:${Math.round(v / mx * 58)}px"></div></div>`;
  const cols = i.m.map((v, k) => { const last = k === i.m.length - 1;
    return `<div class="bc"><div class="bpair">${col(v, "", last)}${withO ? col(i.o[k], "o", last) : ""}</div><div class="bl">${D.mon[k]}</div></div>`; }).join("");
  const legend = withO ? `<span class="lg"></span>продано <span class="lg o"></span>заказывали под клиента · ` : "";
  return `<details><summary>${withO ? "Продажи и заказы по месяцам" : "Продажи по месяцам"}</summary><div class="bars">${cols}</div><div class="bn">${legend}${esc(D.monNote)}, бледное — месяц ещё идёт</div></details>`;
}

const title = i => (i.u ? `<a class="nm" href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.n)}</a>` : `<span class="nm">${esc(i.n)}</span>`) + (i.v ? ` <span class="vit">витрина</span>` : "");
/* Закупка из парсера upgrade33 (коммерческая тайна — только на этой закрытой странице) */
const rub = n => Math.round(n).toLocaleString("ru-RU") + " ₽";
const ddmm = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) : "";
function priceInfo(i){
  if (!D.prices) return "";
  if (i.pa === false) return `<div class="row"><span class="l"><span class="tred">нет у поставщиков</span>${i.lp ? ` · последняя закупка ${rub(i.lp)}${i.ls ? " (" + ddmm(i.ls) + ")" : ""}` : ""}</span></div>`;
  if (i.buy == null) return "";  // товара нет в круге закупок парсера
  const parts = [`закупка от <b>${rub(i.buy)}</b>`];
  if (i.sp) parts.push(`наценка ${Math.round((i.sp / i.buy - 1) * 100)}%`);
  if (i.pc != null) parts.push(i.pt === "down" ? `<span class="tamber">↓ ${fmt(Math.abs(i.pc))}% за 30 дн.</span>`
    : i.pt === "up" ? `<span class="tgreen">↑ ${fmt(i.pc)}% за 30 дн.</span>` : "цена стабильна");
  return `<div class="row"><span class="l">${parts.join(" · ")}</span></div>`;
}
function advice(i){
  if (!D.prices || i.pa !== true || i.pc == null) return "";
  if (i.pc <= -3) return `<div class="adv amber">Закупка дешевеет — бери только до минимума, не впрок</div>`;
  if (i.pc >= 3) return `<div class="adv green">Закупка дорожает — можно взять с запасом</div>`;
  return "";
}
const ordersText = i => !D.orders ? "" : i.ot ? `под заказ ${i.ot} ${times(i.ot)}` : "под заказ не брали";

function card(i){
  const [bt, bc] = BADGE[i.st];
  const big = `<div class="v">${fmt(i.av)} <small>из ${i.min}</small></div>` +
    (i.need > 0 ? `<div class="r red">добрать ${i.need} шт</div>` :
     i.st === "edge" ? `<div class="r amber">≈ ${fmt(i.until)} шт уйдёт до ${D.d1gen}</div>` : `<div class="r green">хватает</div>`);
  const parts = [`остаток ${fmt(i.stk)}`]; if (i.res) parts.push(`резерв ${fmt(i.res)}`); if (i.tr) parts.push(`в пути ${fmt(i.tr)}`);
  const k = kind(i);
  const hint = k ? `<div class="pr">Предлагаю ${k === "drop" ? "<b>убрать из неснижаемого</b>" : `${k === "up" ? "поднять" : "снизить"} неснижаемый <b>${i.min} → ${i.prop}</b>`} — подробнее на вкладке «Нужен неснижаемый»</div>` : "";
  return `<div class="card">
    <div class="ct"><span class="badge ${bc}">${bt}</span>${title(i)}</div>
    <div class="big">${big}</div>
    <div class="row"><span class="l">${parts.join(" · ")}</span><span class="x">продаём ≈ ${fmt(i.pm)} в мес.</span></div>
    ${priceInfo(i)}${i.st !== "ok" ? advice(i) : ""}${hint}${bars(i)}

}

function cardNeed(i){
  const k = kind(i), [bt, bc] = KIND[k];
  const big = k === "drop" ? `<div class="v">убрать <small>из неснижаемого</small></div><div class="r" style="color:var(--muted)">сейчас ${i.min}</div>`

  const facts = [`продаём ≈ ${fmt(i.pm)} в мес.`]; const o = ordersText(i); if (o) facts.push(o + ` за ${D.mon.length} мес.`);

/* Вкладка «Заказы»: что заказывали под клиента — по месяцам («База Ярославль», лист «Заказы 2026») */
let om = "all";
const pl = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };

function orow(r){

function renderOrders(){

function render(){
  chips();
  if (tab === "orders") return renderOrders();
  const byName = (a,b) => a.n.localeCompare(b.n, "ru");
  const list = D.items.filter(match).sort(tab === "stock"
    ? (a,b) => ORDER[a.st] - ORDER[b.st] || b.pm - a.pm || byName(a,b)
    : (a,b) => KORDER[kind(a)] - KORDER[kind(b)] || (b.ot + b.pm) - (a.ot + a.pm) || byName(a,b));
  const all = D.items;
  $("#hs").textContent = `обновлено ${D.gen} · поставка ${D.d1}`;
  $("#copy").textContent = tab === "stock" ? "Скопировать заказ" : "Скопировать список";
  if (tab === "stock") {
    const need = all.filter(i => i.min > 0 && i.st === "need");
    $("#sum").innerHTML = need.length
      ? `К поставке <b>${esc(D.d1)}</b>: добрать <b>${need.reduce((s,i) => s + i.need, 0)} шт</b> по ${need.length} товарам` +
        (D.prices ? ` · по закупке ≈ <b>${rub(need.reduce((s,i) => s + (i.buy ? i.need * i.buy : 0), 0))}</b>` +
          (need.some(i => !i.buy) ? ` <span class="sub" style="display:inline">(без цены: ${need.filter(i => !i.buy).length})</span>` : "") : "") +

  } else {
    const c = k => all.filter(i => kind(i) === k).length;
    const money = (ks, sign) => all.filter(i => ks.includes(kind(i)) && i.buy).reduce((s,i) => s + Math.abs(i.prop - i.min) * i.buy, 0);
    $("#sum").innerHTML = `Предлагаю: добавить в неснижаемый <b>${c("add")}</b>, поднять <b>${c("up")}</b>, снизить или убрать ${c("down") + c("drop")}.` +
      (D.prices ? `<div>Денег в запас по закупке: <b>+${rub(money(["add","up"]))}</b> · освободится ${rub(money(["down","drop"]))}</div>` : "") +
      `<div class="sub">Неснижаемый нужен, если товар продаётся каждый месяц или его постоянно заказывают под клиента.</div>`;
  }
  if (!list.length) { $("#list").innerHTML = `<div class="empty">Ничего не найдено</div>`; return; }
  // «Остатки» — по категориям, как в парсере; «Нужен неснижаемый» — по действию, сверху самые востребованные
  const gkey = i => tab === "stock" ? `${i.c} · ${i.b}` : KIND[kind(i)][0];
  const groups = {}; list.forEach(i => (groups[gkey(i)] = groups[gkey(i)] || []).push(i));

  const csize = {}; list.forEach(i => csize[i.c] = (csize[i.c] || 0) + 1);
  const order = Object.keys(groups).sort(tab === "stock"
    ? (a,b) => { const ca = groups[a][0].c, cb = groups[b][0].c; return csize[cb] - csize[ca] || ca.localeCompare(cb, "ru") || groups[b].length - groups[a].length; }
    : (a,b) => Math.min(...groups[a].map(rank)) - Math.min(...groups[b].map(rank)));
  const fn = tab === "stock" ? card : cardNeed;
  $("#list").innerHTML = order.map(c => `<div class="gh">${esc(c)} · ${groups[c].length}</div>` + groups[c].map(fn).join("")).join("");
}

/* Вход: ключ из пароля (PBKDF2-SHA256) расшифровывает данные (AES-256-GCM). Без пароля данных на странице нет. */
const KEY_STORE = "ms-yar-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function decryptWith(key){
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
function forget(){ try { localStorage.removeItem(KEY_STORE); } catch(e) {} }
async function autoLogin(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null"); } catch(e) {}
  if (!saved || saved.salt !== ENC.salt) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
    start(await decryptWith(key));
  } catch(e) { forget(); }  // пароль сменили — спросим заново
}
$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; $("#err").textContent = "";
  try {
    const key = await keyFromPassword($("#pw").value);
    const data = await decryptWith(key);
    if ($("#rem").checked) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({salt: ENC.salt, k: toB64(await crypto.subtle.exportKey("raw", key))})); } catch(e2) {}
    } else forget();
    start(data);
  } catch(err) {
    $("#err").textContent = window.crypto && crypto.subtle ? "Неверный пароль" : "Браузер не поддерживает расшифровку — откройте страницу в Chrome или Safari";
  }
  btn.disabled = false;
});
$("#out").addEventListener("click", () => { forget(); location.reload(); });
autoLogin();
</script>
